services:
  - type: web
    name: nexus-banking-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BRAPI_TOKEN
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://iamdatagabs.github.io
      - key: MARKET_POLL_SECONDS
        value: "1800"
